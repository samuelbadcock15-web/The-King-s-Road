<style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        #c { width: 100vw; height: 100vh; display: block; }
        #resources { position: absolute; top: 20px; left: 20px; font-weight: bold; font-size: 18px; background: rgba(0,0,0,.6); padding: 10px 15px; border-radius: 5px; display: flex; gap: 15px; color: #fff; z-index: 100; pointer-events: none; }
        .p-gold { color: #ffd700; }
        .ai-gold { color: #f44; }
        
        /* Enlarged Mobile Spawn Sidebar (Middle Left) */
        #spawn-sidebar { position: absolute; top: 50%; left: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px; z-index: 250; }
        .spawn-node { width: 90px; height: 90px; background: rgba(0,0,0,0.75); border: 3px solid #00ffcc; border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.6); transition: transform 0.1s, background 0.2s; }
        .spawn-node:active { transform: scale(0.92); background: rgba(0,255,204,0.3); }
        .spawn-node span:first-child { font-size: 32px; font-weight: bold; }
        .spawn-node span:last-child { font-size: 14px; color: #ffd700; margin-top: 4px; font-weight: bold; }

        /* Mobile D-Pad Controls (Shown automatically on touch devices) */
        #dpad-left { position: absolute; bottom: 20px; left: 130px; width: 260px; height: 260px; display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; z-index: 250; touch-action: none; opacity: 0.65; }
        
        .d-btn { background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); border-radius: 16px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 36px; cursor: pointer; -webkit-touch-callout: none; }
        .d-btn:active { background: rgba(0,255,204,0.35); }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }
        .d-center { grid-column: 2; grid-row: 2; background: rgba(0,0,0,0.3); font-size: 14px; color: #aaa; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        /* Top Right Info Button & Popout */
        #info-container { position: absolute; top: 20px; right: 20px; z-index: 200; }
        #info-btn { width: 36px; height: 36px; background: rgba(0,0,0,0.7); color: #ffd700; border: 2px solid #ffd700; border-radius: 50%; font-weight: bold; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        #hud { position: absolute; top: 45px; right: 0; color: #fff; background: rgba(0,0,0,.85); padding: 15px; border-radius: 5px; font-size: 12px; line-height: 1.4; width: 300px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #444; }
        #info-container:hover #hud, #info-container:active #hud { display: block; }

        #match-status-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 300; font-size: 26px; text-align: center; padding: 20px; box-sizing: border-box; }
        #match-status-sub { font-size: 14px; color: #aaa; margin-top: 15px; }
        #game-over-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,.85); display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 100; font-size: 36px; text-align: center; }
    </style>
